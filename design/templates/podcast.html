<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="templates.css">
<title>Podcast promo 1920x1080</title>
<style>.canvas { grid-template-rows: auto 1fr auto; } .main { display: grid; grid-template-columns: 7fr 5fr; gap: var(--space-9); align-items: center; } .main .title { font-size: var(--tpl-display); }</style>
</head><body><div class="canvas">
  <div class="top"><img class="wordmark" src="../wordmark.svg" alt="The Trust Sequence"><span class="label muted" data-field="date">[Date]</span></div>
  <div class="main">
    <div class="stack">
      <hr class="rule-accent">
      <p class="label" data-field="show">On [Show name]</p>
      <h1 class="title" data-field="title">Walk out with a yes you can walk back in on.</h1>
      <p class="body" data-field="body">Maris Skujins on how trust gets earned before a yes, from both sides of the table.</p>
    </div>
    <figure class="photo">
      <img src="../assets/meet-magento-uk-2026-panel-3x2.jpg" alt="Maris Skujins, third from left, on a panel at Meet Magento UK 2026">
      <figcaption><span data-field="caption">Maris Skujins, third from left.</span><span>Photo: Owen Billcliffe</span></figcaption>
    </figure>
  </div>
  <div class="bottom"><span class="label muted" data-field="footer">Listen wherever you get your podcasts</span><span class="label">thetrustsequence.com</span></div>
</div><script src="fields.js"></script></body></html>
