<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="templates.css">
<title>Cover for a LinkedIn post 1080x1350</title>
<!-- The flat cover for a feed post. The cover is out/cover-ink.png, rendered from cover.html first by render.sh. -->
<style>.canvas { grid-template-rows: minmax(0, 1fr) auto; justify-items: center; row-gap: var(--space-7); } .cover { height: 100%; width: auto; display: block; } .foot { width: 100%; display: grid; gap: var(--space-5); } .foot .row { display: flex; justify-content: space-between; gap: var(--space-5); }</style>
</head><body><div class="canvas">
  <img class="cover" src="out/cover-ink.png" alt="">
  <div class="foot"><hr class="rule-accent"><div class="row"><span class="label">A book in development</span><span class="label muted">thetrustsequence.com</span></div></div>
</div></body></html>
