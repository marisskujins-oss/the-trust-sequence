<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="templates.css">
<title>Open Graph image 1200x630</title>
<!-- The cover on the left third, the title line on the right. The cover is out/cover-ink.png, rendered from cover.html first by render.sh. -->
<style>:root { --tpl-pad: var(--space-8); --tpl-label: 15px; } .canvas { grid-template-columns: auto 1fr; grid-template-rows: minmax(0, 1fr); column-gap: var(--space-8); } .cover { height: 100%; width: auto; display: block; } .side { display: grid; grid-template-rows: auto 1fr auto; } .side .title { font-size: 56px; align-self: center; } .bottom { border-top-color: var(--color-rule); }</style>
</head><body><div class="canvas">
  <img class="cover" src="out/cover-ink.png" alt="">
  <div class="side">
    <div class="stack" style="gap: var(--space-4)"><hr class="rule-accent"><p class="label">The Trust Sequence. A book in development.</p></div>
    <h1 class="title">Walk out with a yes you can walk back in on.</h1>
    <div class="bottom"><span class="label muted">Maris Skujins</span><span class="label muted">thetrustsequence.com</span></div>
  </div>
</div></body></html>
