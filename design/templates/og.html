<!doctype html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="templates.css">
<title>Open Graph image 1200x630</title>
<style>:root { --tpl-pad: var(--space-8); --tpl-label: 15px; --tpl-wordmark-h: 26px; } .canvas { grid-template-rows: auto 1fr; } .main { display: grid; grid-template-columns: 6fr 5fr; gap: var(--space-7); align-items: center; } .main .title { font-size: 58px; } .proof { display: flex; align-items: baseline; gap: var(--space-3); padding-top: var(--space-3); border-top: var(--rule-width) solid var(--color-rule); } .proof b { font-family: var(--font-display); font-weight: var(--weight-display); font-size: 36px; line-height: 1; }</style>
</head><body><div class="canvas">
  <div class="top"><img class="wordmark" src="../wordmark.svg" alt="The Trust Sequence"><span class="label muted">A book in development</span></div>
  <div class="main">
    <div class="stack" style="gap: var(--space-5)">
      <hr class="rule-accent">
      <h1 class="title">Walk out with a yes you can walk back in on.</h1>
      <p class="proof"><b>600+</b><span class="label muted">Recorded conversations</span></p>
    </div>
    <figure class="photo">
      <img src="../assets/meet-magento-uk-2026-panel-3x2.jpg" alt="">
      <figcaption><span>Meet Magento UK 2026</span><span>Photo: Owen Billcliffe</span></figcaption>
    </figure>
  </div>
</div></body></html>
