<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="templates.css">
<title>Quote card 1080x1080</title>
<style>.canvas { grid-template-rows: 1fr auto; } .main { align-self: center; border-left: var(--rule-width) solid var(--color-ink); padding-left: var(--space-7); } .quote { font-family: var(--font-display); font-weight: var(--weight-display); font-size: var(--tpl-quote); line-height: var(--leading-tight); letter-spacing: var(--tracking-display); text-wrap: balance; }</style>
</head><body><div class="canvas">
  <figure class="main stack">
    <hr class="rule-accent">
    <blockquote class="quote" data-field="quote">"Nobody wants to take responsibility for the unknown."</blockquote>
    <figcaption class="label muted" data-field="cite">Maris Skujins</figcaption>
  </figure>
  <div class="bottom"><img class="wordmark" src="../wordmark.svg" alt="The Trust Sequence"><span class="label">thetrustsequence.com</span></div>
</div><script src="fields.js"></script></body></html>
